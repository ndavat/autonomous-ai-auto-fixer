# Default Configuration for Autonomous AI Auto-Fixer
# Bound to AutoFixer.Models.AppConfig via ConfigLoader.

agent:
  mode: DryRun             # DryRun | Fix (bound to AgentMode enum)
  baseBranch: main
  repositories: []
  maxFindingsPerRepo: 10
  enableSelfCorrection: true

ingestion:
  mend:
    enabled: false
    apiUrl: ""
    apiKey: ""
  sonarQube:
    enabled: false
    hostUrl: ""
    token: ""
  trivy:
    enabled: false
    scanType: fs
  csv:
    enabled: false
    idColumn: "Id"
    severityColumn: "Severity"
    typeColumn: "Type"
    titleColumn: "Title"
    descriptionColumn: "Description"
    filePathColumn: "FilePath"
    lineNumberColumn: "LineNumber"
  excel:
    enabled: false
    sheetIndex: 0
    idColumn: "Id"
    severityColumn: "Severity"
    typeColumn: "Type"
    titleColumn: "Title"
    descriptionColumn: "Description"
    filePathColumn: "FilePath"
    lineNumberColumn: "LineNumber"
  pdf:
    enabled: false
  sarif:
    enabled: false

remediation:
  maxRetries: 3
  timeoutSeconds: 300
  enableValidation: true
  validationRetries: 1
  linters: []
  buildVerificationCommands: []  # e.g. ["dotnet build"]

llm:
  provider: azure-openai
  modelName: gpt-4
  temperature: 0.0
  maxTokens: 4096
  timeoutSeconds: 300
  endpoint: null
  apiKey: null

secrets:
  source: environment      # environment | keyvault
  keyVaultUrl: null

vcs:
  provider: github         # github | azure-devops
  token: null
  apiUrl: null
